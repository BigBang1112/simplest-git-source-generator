name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build the Docker image
        run: docker build -f Samples/SimplestGitConsoleApp/Dockerfile -t simplest-git-console-app .

      - name: Run the sample
        run: docker run --rm simplest-git-console-app
