name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Continuous Integration
    uses: bigbang1112/workflows/.github/workflows/dotnet-ci.yml@main
    with:
      dotnet-version: 10.0.x
      enable-coverage: true